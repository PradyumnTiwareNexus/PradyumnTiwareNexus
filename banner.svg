<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07121a"/>
      <stop offset="50%" stop-color="#04121a"/>
      <stop offset="100%" stop-color="#00121a"/>
    </linearGradient>

    <linearGradient id="meshGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#001826" stop-opacity="0.0"/>
      <stop offset="0.3" stop-color="#003246" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#002b3a" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" stroke="#03283a" stroke-width="0.6" fill="none" />
    </pattern>

    <filter id="fnoise">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="turb"/>
      <feColorMatrix type="saturate" values="0" in="turb" result="mono"/>
      <feBlend in2="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="300" fill="url(#bgGrad)"/>

  <!-- subtle grid / mesh -->
  <rect width="1600" height="300" fill="url(#meshGrad)" opacity="0.7"/>
  <rect width="1600" height="300" fill="url(#grid)" opacity="0.05"/>

  <!-- diagonal cyber lines -->
  <g opacity="0.08" stroke="#07a9ff" stroke-width="1.2">
    <path d="M-200 280 L600 -120" />
    <path d="M0 300 L800 -120" />
    <path d="M200 300 L1000 -120" />
    <path d="M400 300 L1200 -120" />
  </g>

  <!-- faint scanline bands -->
  <g fill="#0a2230" opacity="0.08">
    <rect x="0" y="40" width="1600" height="6"/>
    <rect x="0" y="120" width="1600" height="6"/>
    <rect x="0" y="200" width="1600" height="6"/>
  </g>

  <!-- glitch rectangles -->
  <g>
    <rect x="80" y="60" width="320" height="24" fill="#001c28" opacity="0.55" transform="skewX(-6)"/>
    <rect x="420" y="140" width="220" height="16" fill="#002428" opacity="0.45" transform="skewX(-4)"/>
    <rect x="760" y="80" width="300" height="18" fill="#002633" opacity="0.45" transform="skewX(-5)"/>
  </g>

  <!-- main neon text: multiple layers for glitch effect -->
  <g font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" transform="translate(800,155)">
    <!-- shadow / glow layers -->
    <text x="0" y="0" font-size="46" fill="#00111a" transform="translate(-6,6)" opacity="0.9">Pradyumn Tiware Nexus</text>
    <text x="-4" y="-2" font-size="46" fill="#00bfff" opacity="0.08" filter="url(#glow)">Pradyumn Tiware Nexus</text>
    <!-- red / cyan split for glitch -->
    <text x="-2" y="0" font-size="46" fill="#00bfff" transform="translate(-3,0)">Pradyumn Tiware Nexus</text>
    <text x="6" y="0" font-size="46" fill="#ff3b8c" transform="translate(4,0)" opacity="0.18">Pradyumn Tiware Nexus</text>

    <!-- main crisp text on top -->
    <text x="0" y="0" font-size="46" fill="#dff6ff" style="letter-spacing:1px">Pradyumn Tiware Nexus</text>
  </g>

  <!-- small subtitle -->
  <g transform="translate(800,195)" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="0" y="0" font-size="16" fill="#9ad8ff" opacity="0.9">Cybersecurity Researcher • Bug Bounty • Recon Automation</text>
  </g>

  <!-- animated-like scanline glow (static in SVG, gives feel) -->
  <g opacity="0.14" filter="url(#neon)">
    <ellipse cx="300" cy="70" rx="260" ry="40" fill="#00bfff" opacity="0.02"/>
    <ellipse cx="1100" cy="220" rx="260" ry="40" fill="#ff4b9a" opacity="0.015"/>
  </g>

  <!-- small anime/hacker icon (simple) -->
  <g transform="translate(1400,40)" opacity="0.9">
    <rect x="-56" y="-18" width="112" height="64" rx="8" fill="#041f2a" stroke="#00bfff" stroke-width="1" opacity="0.4"/>
    <path d="M-30 10 q20 -34 60 0" fill="none" stroke="#00bfff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#00bfff"/>
  </g>

  <!-- footer cyber line -->
  <path d="M40 265 L1560 265" stroke="#052b36" stroke-width="3" opacity="0.6"/>

</svg>
